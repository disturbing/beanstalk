packages:
  - 'packages/*'

allowBuilds:
  # core-js-pure's postinstall only prints a message (agents → mimetext → @babel/runtime-corejs3).
  core-js-pure: false
  esbuild: true
  workerd: true

# One version per dependency across the repo. Packages reference these with
# "hono": "catalog:" instead of a literal version.
catalog:
  '@cloudflare/containers': 0.3.7
  '@cloudflare/vite-plugin': 1.62.5
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@fontsource-variable/familjen-grotesk': 5.3.0
  '@fontsource-variable/jetbrains-mono': 5.3.0
  '@fontsource-variable/newsreader': 5.3.0
  '@hono/zod-validator': 0.9.1
  '@modelcontextprotocol/client': 2.0.0
  '@modelcontextprotocol/server': 2.0.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.1.1
  '@vitejs/plugin-rsc': 0.5.35
  agents: 0.26.0
  diff: 9.0.0
  hono: 4.13.12
  react: 19.3.0
  react-dom: 19.3.0
  react-server-dom-webpack: 19.3.0
  typescript: 7.0.2
  vinext: 1.0.1
  vite: 8.3.2
  vitest: 4.1.11
  wrangler: 4.147.0
  zod: 4.6.5

minimumReleaseAgeExclude:
  - wrangler@4.147.0
