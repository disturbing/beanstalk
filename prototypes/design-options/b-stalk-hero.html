<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Option B: Stalk hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/base.css">
<style>
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
  .askwrap { max-width: 820px; margin: 4px auto 20px; }
  .askwrap .ask { border-radius: 999px; padding-left: 8px; }
  .askwrap .ask input { font-size: 16px; padding: 12px 0; }
  .askwrap .asked { justify-content: center; }
  .hero { border: 1px solid var(--border); border-radius: 8px; background: var(--bg); margin-bottom: 20px; }
  .herohead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-muted); }
  .herohead h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .herohead .r { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12px; color: var(--fg-muted); }
  .play { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: var(--subtle); display: grid; place-items: center; }
  .key { display: inline-flex; align-items: center; gap: 5px; }
  svg.tl { display: block; width: 100%; height: auto; }
  svg.tl text { font: 11px var(--sans); fill: var(--fg-muted); }
  svg.tl .lbl { font: 600 11px var(--sans); }
  @media (prefers-reduced-motion: no-preference) {
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-3px); } }
  }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
  .trk { width: 220px; }
  .trk svg { display: block; }
  .ftable .msg { width: 40%; }
  .side .box + .box { margin-top: 16px; }
  .budlist { list-style: none; margin: 0; padding: 6px 0; }
  .budlist li { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; padding: 5px 14px; font-size: 13px; align-items: center; }
  .budlist li .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .budlist .a { color: var(--bean); font-weight: 600; font-size: 12px; }
  .budlist .s { color: var(--fg-muted); font-size: 12px; }
  .filegrid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
  .filetrack { padding: 10px 16px; border-bottom: 1px solid var(--border-muted); }
  .filetrack .cap { font-size: 12px; color: var(--fg-muted); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../repo-experience/data.js"></script>
<script src="../repo-experience/model.js"></script>
<script src="shared/kit.js"></script>
<script>
(function () {
  const { esc, short, ICON } = K;
  const T = K.moment(760);
  const view = K.params.get('view') || 'home';
  const flying = M.inflightAt(T);
  const stalkIdx = M.stalkIdxAt(T);
  const landed = M.landings.filter((l) => l.t <= T);
  const W = 1230;
  const fmt = (t) => { const s = Math.round(t - M.T0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  /** The beanstalk across the page: time left to right, the stalk behind, the sprout ahead, buds above the tip. */
  function heroSvg(H, focus) {
    const L = 40, R = W - 30, y = Math.round((H - 30) / 2) + 4;
    const x = (t) => L + ((t - M.T0) / (M.TEND - M.T0)) * (R - L);
    const nowX = x(T);
    const stalkL = M.landings.find((l) => l.idx === stalkIdx);
    const stalkX = stalkL ? x(stalkL.t) : L;
    const g = [];
    // time ticks
    for (let m = 0; m <= 16; m += 2) { const tx = x(M.T0 + m * 60); g.push(`<line x1="${tx}" y1="${H - 26}" x2="${tx}" y2="${H - 20}" stroke="var(--border)"/><text x="${tx}" y="${H - 8}" text-anchor="middle">${m}:00</text>`); }
    // future (not yet grown)
    g.push(`<line x1="${nowX}" y1="${y}" x2="${R}" y2="${y}" stroke="var(--border)" stroke-width="2" stroke-dasharray="2 5"/>`);
    // stalk then sprout
    g.push(`<line x1="${L}" y1="${y}" x2="${stalkX}" y2="${y}" stroke="var(--leaf)" stroke-width="5" stroke-linecap="round"/>`);
    g.push(`<line x1="${stalkX}" y1="${y}" x2="${nowX}" y2="${y}" stroke="var(--sprout)" stroke-width="5" stroke-linecap="round"/>`);
    // red validations and decisions
    for (const v of M.validations.filter((v) => !v.green && v.t <= T)) g.push(`<g transform="translate(${x(v.t)},${y})"><circle r="7" fill="var(--bg)" stroke="var(--red)" stroke-width="2"/><path d="M-3-3L3 3M3-3L-3 3" stroke="var(--red)" stroke-width="2"/></g>`);
    for (const d of M.decisions.filter((d) => d.t <= T)) g.push(`<g transform="translate(${x(d.t)},${y})"><rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="var(--pick)"/></g>`);
    // leaves for landings, alternating up and down, length by size
    landed.forEach((l, i) => {
      const lx = x(l.t), up = i % 2 === 0, s = K.leafState(l, T);
      const col = s === 'red' ? 'var(--red)' : s === 'sprout' ? 'var(--sprout)' : 'var(--leaf)';
      const lines = l.files.reduce((a, f) => a + f.additions + f.deletions, 0);
      const len = 14 + Math.min(26, Math.sqrt(lines) * 2.4);
      const dir = up ? -1 : 1;
      g.push(`<path d="M${lx} ${y} q ${len * 0.15} ${dir * len * 0.9} ${len * 0.75} ${dir * len} q ${-len * 0.05} ${-dir * len * 0.7} ${-len * 0.75} ${-dir * len}Z" fill="${col}" opacity="${focus && !focus.has(l.task) ? '.18' : '.92'}"><title>#${l.idx} ${esc(l.title)}</title></path>`);
    });
    // flags: stalk pointer and sprout tip
    if (stalkL) g.push(`<g transform="translate(${stalkX},${y + 46})"><line x1="0" y1="-38" x2="0" y2="-10" stroke="var(--leaf)" stroke-dasharray="2 2"/><text class="lbl" text-anchor="middle" style="fill:var(--leaf)">stalk #${stalkIdx}</text></g>`);
    g.push(`<g transform="translate(${nowX},${y})"><circle r="6" fill="var(--sprout)"/><circle r="11" fill="none" stroke="var(--sprout)" opacity=".5"/></g>`);
    g.push(`<text class="lbl" x="${nowX}" y="${y + 50}" text-anchor="middle" style="fill:#4d7a00">sprout #${landed.length - 1}, now</text>`);
    // buds: the beans in flight, waiting to drop onto the tip, each on a dashed stem
    const shown = flying.slice(0, 9);
    const top = y - (shown.length - 1) * 10;
    shown.forEach((b, i) => {
      const by = top + i * 20, bx = nowX + 70;
      const col = b.state === 'reworking' ? 'var(--red)' : 'var(--bean)';
      const mark = b.state === 'checking' ? `<circle cx="${bx}" cy="${by}" r="5.5" fill="var(--bg)" stroke="var(--amber)" stroke-width="2.5"/>` : `<circle cx="${bx}" cy="${by}" r="6" fill="${col}"/>`;
      const title = b.title.length > 38 ? b.title.slice(0, 37) + '…' : b.title;
      g.push(`<g class="bob" style="animation-delay:${(i * 0.27).toFixed(2)}s"><path d="M${bx - 7} ${by} C ${nowX + 40} ${by}, ${nowX + 30} ${y}, ${nowX + 8} ${y}" fill="none" stroke="var(--bean)" stroke-opacity=".3" stroke-dasharray="2 3"/>${mark}
        <text x="${bx + 12}" y="${by + 4}"><tspan class="lbl" style="fill:var(--bean)">${b.agent}</tspan> ${esc(title)}</text><title>${b.agent} ${b.state}: ${esc(b.title)}</title></g>`);
    });
    if (flying.length > shown.length) g.push(`<text x="${nowX + 82}" y="${top + shown.length * 20 + 4}">and ${flying.length - shown.length} more growing</text>`);
    if (!flying.length) g.push(`<text x="${nowX + 22}" y="${y + 4}" class="lbl">Nothing growing. The swarm is resting.</text>`);
    return `<svg class="tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="The beanstalk over time">${g.join('')}</svg>`;
  }

  /** A little track on the same time axis: when this path was touched. */
  function track(path, w = 220, h = 22) {
    const xs = (t) => 4 + ((t - M.T0) / (M.TEND - M.T0)) * (w - 8);
    const hits = landed.filter((l) => l.files.some((f) => f.path === path || f.path.startsWith(path + '/')));
    const fl = K.inflightOn(path, T, flying);
    const dots = hits.map((l) => { const s = K.leafState(l, T); return `<circle cx="${xs(l.t)}" cy="${h / 2}" r="3.5" fill="${s === 'red' ? 'var(--red)' : s === 'sprout' ? 'var(--sprout)' : 'var(--leaf)'}"><title>#${l.idx} ${esc(l.title)}</title></circle>`; }).join('');
    const bud = fl.length ? `<circle class="bob" cx="${xs(T) + 6}" cy="${h / 2 - 4}" r="3.5" fill="var(--bean)"/>` : '';
    return `<svg width="${w}" height="${h}"><line x1="4" y1="${h / 2}" x2="${xs(T)}" y2="${h / 2}" stroke="var(--border)" /><line x1="${xs(T)}" y1="${h / 2}" x2="${w - 4}" y2="${h / 2}" stroke="var(--border-muted)" stroke-dasharray="2 3"/>${dots}${bud}</svg>`;
  }

  function hero(H, focus) {
    return `<section class="hero"><div class="herohead"><span style="color:var(--leaf)">${ICON.stalk}</span><h2>The beanstalk</h2><span class="muted" style="font-size:13px">${landed.length} beans on the sprout, stalk at #${stalkIdx}, ${flying.length} growing</span>
      <span class="r"><span class="key"><i class="leaf"></i>stalk</span><span class="key"><i class="leaf sprout"></i>sprout</span><span class="key"><i class="budd"></i>in flight</span><span class="key"><i class="leaf red"></i>turned it red</span>
      <button class="play" aria-label="Replay">▸</button><span style="font-variant-numeric:tabular-nums">${fmt(T)}</span></span></div>${heroSvg(H, focus)}</section>`;
  }

  function growing() {
    return `<div class="box"><div class="boxhead"><b>Growing now</b><span class="right"><span class="picked" title="Jev ranked who to watch first">Jev ranked</span></span></div><ul class="budlist">${flying.slice(0, 8).map((b) => `<li><span class="a">${b.agent}</span><span class="t">${esc(b.title)}</span><span class="s"><i class="budd ${b.state === 'checking' ? 'checking' : b.state === 'reworking' ? 'reworking' : 'pulse'}"></i> ${b.state}</span></li>`).join('')}</ul></div>`;
  }

  function home() {
    return `${hero(230)}
      <div class="cols"><div class="box"><div class="boxhead">${K.branchButton(T)}<span class="right">activity on the same timeline</span></div>
        ${K.fileTable('src', T, { extra: (e) => `<td class="trk">${track(e.path)}</td>` })}</div>
        <div class="side">${growing()}<div class="box"><div class="boxhead"><b>What happened</b></div>${K.stories(T)}</div></div></div>`;
  }

  function files() {
    const file = 'src/shipping/service.ts';
    const owners = K.fileOwners(file);
    const onIt = K.inflightOn(file, T, flying);
    const touching = new Set(landed.filter((l) => l.files.some((f) => f.path === file)).map((l) => l.task));
    return `${hero(200, touching)}
      <div class="filegrid"><div class="box"><div class="boxhead"><b>Files</b><span class="right">${K.branchButton(T).split('</button>')[0]}</button></span></div>${K.miniTree('src/shipping', T, file)}</div>
      <div class="box"><div class="boxhead">${ICON.file}<b>src/shipping/${esc(short(file))}</b><span class="right">${onIt.map(K.budChip).join(' ')}<button class="btn sm">Blame by bean</button></span></div>
        <div class="filetrack"><div class="cap">This file on the beanstalk: ${owners.map((l) => K.beanChip(l, T)).join(' ')}</div>${track(file, 860, 26)}</div>
        ${K.codeView(file, 30, T)}</div></div>`;
  }

  document.getElementById('app').innerHTML = `${K.repoHead('code', { T })}<main class="wrap">
    <div class="askwrap">${K.askBox('Ask the beanstalk anything', ['What landed on the sprout in the last 5 minutes?', 'Why did the sprout go red?', "What's being worked on in billing?"])}</div>
    ${view === 'files' ? files() : home()}</main>`;
})();
</script>
</body>
</html>
