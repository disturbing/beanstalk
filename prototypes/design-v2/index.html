<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beanstalk Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-options/shared/base.css">
<link rel="stylesheet" href="stalk.css">
<link rel="stylesheet" href="skins.css">
<link rel="stylesheet" href="nightshift.css">
<script>
  /* ?skin=greenhouse|swiss|nightshift (default: the GitHub-style base) and ?theme=light|dark (default: the system's). */
  (function () {
    const p = new URLSearchParams(location.search);
    const skin = ['greenhouse', 'swiss', 'nightshift'].includes(p.get('skin')) ? p.get('skin') : 'base';
    const theme = p.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const root = document.documentElement;
    root.dataset.skin = skin;
    root.dataset.theme = theme;
    root.dataset.day = ['paper', 'phosphor', 'blueprint'].includes(p.get('day')) ? p.get('day') : 'phosphor';
    const fonts = {
      greenhouse: 'Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500',
      swiss: 'Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500',
      nightshift: 'Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600',
    }[skin];
    if (fonts) document.write(`<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=${fonts}&display=swap">`);
  })();
</script>
</head>
<body>
<div id="head"></div>
<div class="themetoggle" id="themetoggle" role="group" aria-label="Appearance">
  <button type="button" data-set-theme="light" aria-label="Day mode" title="Day mode">☀</button>
  <button type="button" data-set-theme="dark" aria-label="Night mode" title="Night mode">☾</button>
  <select id="dayvariant" aria-label="Day style" title="Day style"><option value="phosphor">phosphor</option><option value="paper">paper</option><option value="blueprint">blueprint</option></select>
</div>
<style>
  .themetoggle { position: fixed; top: 10px; right: 64px; z-index: 50; display: flex; gap: 2px; align-items: center; padding: 3px; border: 1px solid var(--border, #8884); border-radius: 8px; background: var(--bg, transparent); font: 12px/1 ui-monospace, monospace; }
  .themetoggle button { all: unset; cursor: pointer; padding: 4px 8px; border-radius: 6px; color: var(--fg-muted, inherit); }
  .themetoggle button[aria-pressed="true"] { background: var(--leaf, #2a9); color: #fff; }
  .themetoggle select { font: inherit; padding: 3px 4px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--fg-muted, inherit); }
  [data-theme="dark"] .themetoggle select { display: none; }
</style>
<script>
  (function () {
    const root = document.documentElement, box = document.getElementById('themetoggle'), sel = document.getElementById('dayvariant');
    function sync() {
      box.querySelectorAll('[data-set-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.setTheme === root.dataset.theme)));
      sel.value = root.dataset.day;
    }
    function save() {
      const p = new URLSearchParams(location.search);
      p.set('theme', root.dataset.theme);
      if (root.dataset.theme === 'light') p.set('day', root.dataset.day); else p.delete('day');
      history.replaceState(null, '', '?' + p.toString());
      sync();
    }
    box.addEventListener('click', e => { const b = e.target.closest('[data-set-theme]'); if (b) { root.dataset.theme = b.dataset.setTheme; save(); } });
    sel.addEventListener('change', () => { root.dataset.day = sel.value; save(); });
    sync();
  })();
</script>

<main class="page">
  <aside class="stalkcol" aria-label="The beanstalk">
    <div class="stalkhead"><b>The beanstalk</b><span id="stalkSummary" class="muted"></span></div>
    <div class="stalkscroll" id="stalk"></div>
    <div class="scrub">
      <button id="play" class="play" type="button" aria-label="Play the run">▶</button>
      <input id="range" type="range" min="0" max="1000" aria-label="Moment of the run">
      <output id="clock"></output>
    </div>
  </aside>
  <section class="explorer" id="explorer" aria-live="polite"></section>
</main>
<footer class="statusline" id="status" aria-label="Status"></footer>
<script src="../repo-experience/data.js"></script>
<script src="../repo-experience/model.js"></script>
<script src="../design-options/shared/kit.js"></script>
<script src="explorer.js"></script>
<script src="stalk.js"></script>
</body>
</html>
