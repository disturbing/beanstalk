# Deploys a fork's environments (docs/claude-opus/30-environments.md): staging on every push to
# prototype, production on a manual run. Each job runs only when its environments/<env>/env.jsonc
# is committed, so in the public repository, which has none, nothing deploys.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN (edit: Workers Scripts, D1, Workers KV,
# R2, Queues, Containers, Artifacts). Worker secrets are not passed: the Workers already hold
# them, and `env:deploy` fails if a required one is missing.
name: deploy

on:
  push:
    branches: [prototype]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          if [ -f "environments/$TARGET/env.jsonc" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "no environments/$TARGET/env.jsonc in this repository: nothing to deploy"; fi
      - if: steps.present.outputs.yes == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.present.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.present.outputs.yes == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.present.outputs.yes == 'true'
        run: pnpm env:deploy "$TARGET"
