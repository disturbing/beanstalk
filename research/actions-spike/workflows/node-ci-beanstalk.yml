# The fastify suite (the race's GitHub-arm workflow) with the code checked out from a Beanstalk
# repository on the live gateway. actions/checkout builds its remote as
# `${origin(github-server-url)}/${owner}/${repo}` (path dropped, no `.git`), so `server` is a host
# that serves git at its root: the spike Worker, which rewrites to the gateway's /git/<o>/<r>.git/.
name: suite
on: [push, pull_request]
jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: meta
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.spike.repository }}
          github-server-url: ${{ github.event.spike.server }}
          token: ${{ secrets.BEANSTALK_READ_TOKEN }}
          ref: ${{ github.event.spike.ref }}
          path: fastify
      - run: cd fastify && git log -1 --format='checked out %H %s'
      - uses: actions/setup-node@v4
        with:
          node-version: "25.8.1"
      - name: install
        working-directory: fastify
        run: mkdir -p "$RUNNER_TEMP/deps" && cp ../meta/.github/race/package.json ../meta/.github/race/package-lock.json "$RUNNER_TEMP/deps/" && (cd "$RUNNER_TEMP/deps" && npm ci --no-audit --no-fund --ignore-scripts) && ln -sfn "$RUNNER_TEMP/deps/node_modules" node_modules
      - name: suite
        working-directory: fastify
        env:
          CI: "1"
        run: node --version && node --no-use-env-proxy --test --test-timeout=60000 --test-reporter=dot 'test/!(listen.5).test.js' 'test/*/**/*.test.js' 'test/**/*.test.mjs'
