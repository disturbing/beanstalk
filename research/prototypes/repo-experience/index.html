<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beanstalk Plot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#" aria-label="Beanstalk home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 22V4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <path d="M12 13c0-4 3-6.5 7-6.5 0 4-3 6.5-7 6.5Z" fill="var(--leaf)" />
          <path d="M12 9C12 6 9.8 4 6.5 4c0 3 2.2 5 5.5 5Z" fill="var(--sprout)" />
        </svg>
        <span>beanstalk</span>
      </a>
      <div class="repo">
        <strong>beanstalk-shop</strong>
        <span class="run" id="runLabel"></span>
      </div>
      <form class="ask" id="askForm" role="search">
        <svg class="ask-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path
            d="m13.5 13.5 4 4"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
          />
        </svg>
        <input
          id="askInput"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Ask about this repository"
          aria-label="Ask about this repository"
        />
        <kbd>/</kbd>
      </form>
      <button class="picks-btn" id="picksBtn" type="button" aria-haspopup="dialog">
        <svg class="bean" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M5 2.5c3-1.5 8 1 8.5 5 .5 4-3.5 7-7 6S1 9 2.5 6c.6-1.3 1.3-2.8 2.5-3.5Z" />
        </svg>
        <span id="picksCount">0 picks</span>
        <span class="picker-mode" id="pickerMode"></span>
      </button>
      <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch light or dark">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M10 3.5a6.5 6.5 0 0 1 0 13Z" fill="currentColor" />
        </svg>
      </button>
    </header>

    <main class="layout">
      <section class="plot-wrap" aria-label="The plot: every landing by area of the code">
        <div class="lead" id="lead"></div>
        <div class="chips" id="chips"></div>
        <div class="plot" id="plot"></div>
        <div class="scrub" id="scrub">
          <button id="playBtn" type="button" class="play" aria-label="Play the run">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path id="playIcon" d="M4 2.5v11l9-5.5Z" fill="currentColor" />
            </svg>
          </button>
          <div class="track" id="track">
            <div class="ticks" id="ticks"></div>
            <input
              id="timeRange"
              type="range"
              min="0"
              max="1000"
              step="1"
              aria-label="Time in the run"
            />
          </div>
          <output id="clock" class="clock"></output>
          <button id="nowBtn" type="button" class="now">End</button>
        </div>
      </section>
      <aside class="pane" id="pane" aria-live="polite"></aside>
    </main>

    <div class="popover" id="popover" role="dialog" hidden></div>
    <div class="drawer" id="drawer" role="dialog" aria-label="Every pick on this page" hidden></div>

    <script src="data.js"></script>
    <script src="jev.js"></script>
    <script src="model.js"></script>
    <script src="app.js"></script>
  </body>
</html>
